[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
clipper-core = { path = "crates/clipper-core" }
clipper-ui = { path = "crates/clipper-ui" }
clipper-storage = { path = "crates/clipper-storage" }
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
