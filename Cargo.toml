[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
clipper-core = { path = "crates/clipper-core" }
clipper-ui = { path = "crates/clipper-ui" }
clipper-storage = { path = "crates/clipper-storage" }
clipper-platform = { path = "crates/clipper-platform" }
clipper-capture = { path = "crates/clipper-capture" }
clipper-encoder = { path = "crates/clipper-encoder" }
clipper-recorder = { path = "crates/clipper-recorder" }
clipper-audio = { path = "crates/clipper-audio" }
clipper-replay = { path = "crates/clipper-replay" }
# Same versions GPUI already pulls in, so no duplicate compilation.
async-channel = "2.5"
raw-window-handle = "0.6"
rtrb = "0.4.1"
windows = "0.61.3"
windows-core = "0.61.2"
gpui ={ version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
