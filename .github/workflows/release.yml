name: Release

# Publishes a GitHub Release for a pushed version tag (see docs/release.md).
# Merging a PR never releases: only an intentional `git push origin vX.Y.Z`.
on:
  push:
    tags: ['v*']
  # Dry run for changes to the release pipeline: validation, build and
  # packaging run, the publish job never does.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - scripts/release/**
      - crates/clipper-app/Cargo.toml
      - crates/clipper-app/build.rs

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release half way; dry runs may be superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify tag and version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and branches, to check that the tag is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test tag validation
        run: scripts/release/check-version.test.sh

      - name: Check that the tagged commit is on main
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tagged="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error::tag $TAG points at $tagged, the workflow runs for $GITHUB_SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG ($GITHUB_SHA) is not on main; release tags must point at a merged commit"
            exit 1
          fi

      # Toolchain comes from rust-toolchain.toml; `cargo metadata` needs no build.
      - run: rustup show active-toolchain || rustup toolchain install

      - name: Check tag against the Cargo version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT" != push ]]; then
            # Dry run: validate the version a release of this tree would use.
            TAG="v$(cargo metadata --format-version 1 --no-deps --locked |
              jq -r '.packages[] | select(.name == "clipper-app") | .version')"
            echo "Dry run for $TAG"
          fi
          scripts/release/check-version.sh "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # The same fmt, Clippy and test jobs as every PR, on the tagged commit.
  # Skipped on dry runs: the PR's own CI run covers them.
  checks:
    name: CI
    needs: verify
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Windows x64
    needs: [verify, checks]
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      (needs.checks.result == 'success' ||
       (github.event_name == 'pull_request' && needs.checks.result == 'skipped'))
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain and components come from rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build clipuh.exe
        run: cargo build --release --locked -p clipper-app --bin clipuh
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: ./scripts/release/package.ps1 -Version $env:VERSION -OutDir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipuh-windows-x64
          path: dist/clipuh-v*-windows-x64.zip*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [verify, checks, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to approve each release.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clipuh-windows-x64
          path: dist

      - name: Verify artifacts
        working-directory: dist
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          zip="clipuh-${TAG}-windows-x64.zip"
          expected="$(printf '%s\n' "$zip" "$zip.sha256")"
          actual="$(find . -mindepth 1 -printf '%P\n' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::unexpected release files: $actual"
            exit 1
          fi
          sha256sum -c "$zip.sha256"

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; delete it deliberately or release a new version"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          zip="clipuh-${TAG}-windows-x64.zip"
          hash="$(cut -d' ' -f1 "dist/$zip.sha256")"
          cat > notes.md <<EOF
          ## Download

          Windows 10/11 x64: \`$zip\`. Unzip it anywhere and run \`clipuh.exe\`.
          Settings, clips and logs live in your user profile, not next to the executable,
          so replacing \`clipuh.exe\` with a newer version keeps them.

          SHA-256: \`$hash\`

          \`\`\`powershell
          (Get-FileHash .\\$zip -Algorithm SHA256).Hash
          \`\`\`

          This build is **not code-signed** yet; Windows SmartScreen may warn on first start.
          The checksum detects a corrupted download, it does not prove who built the file.
          EOF
          args=()
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "dist/$zip" "dist/$zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "clipuh $TAG" \
            --notes-file notes.md \
            --generate-notes \
            "${args[@]}"
