# cargo-about configuration for THIRD_PARTY_NOTICES.md.
# Regenerate with: scripts/licenses/generate-notices.sh (see docs/licensing.md).

# Only the shipped target: clipuh.exe for Windows x64.
targets = ["x86_64-pc-windows-msvc"]
# Build scripts, proc-macro build helpers and test-only crates are not
# distributed in clipuh.exe.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Workspace crates (publish = false) are clipuh's own code, not third-party.
private = { ignore = true }

# Every license a dependency may be used under. A crate whose license
# expression cannot be satisfied from this list fails the generation, so a new
# or changed license needs a deliberate review. When a crate offers a choice,
# the first matching license in this order is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    # option-ext (via `directories`): file-level copyleft, unmodified. See
    # docs/licensing.md for the source-availability notice.
    "MPL-2.0",
]

# Known crates whose license files need help to be identified.
workarounds = ["ring", "rustls", "chrono"]
